      authManager: `from typing import Generator
import httpx


class BearerTokenAuth(httpx.Auth):
    def __init__(self, auth_url: str, client_id: str, client_secret: str):
        self.auth_url = auth_url
        self.client_id = client_id
        self.client_secret = client_secret
        self._token: str | None = None

    def _fetch_token(self) -> str:
        response = httpx.post(
            self.auth_url,
            json={"client_id": self.client_id, "client_secret": self.client_secret},
            timeout=10.0,
        )
        response.raise_for_status()
        self._token = response.json()["access_token"]
        return self._token

    def auth_flow(self, request: httpx.Request) -> Generator[httpx.Request, httpx.Response, None]:
        if not self._token:
            self._fetch_token()

        request.headers["Authorization"] = f"Bearer {self._token}"
        response = yield request

        # Auto-refresh once on 401 Unauthorized and retry
        if response.status_code == 401:
            self._fetch_token()
            request.headers["Authorization"] = f"Bearer {self._token}"
            yield request`,

      httpClient: `import json
import logging
import allure
import httpx
from tenacity import retry, retry_if_exception_type, stop_after_attempt, wait_exponential
from config.settings import settings

logger = logging.getLogger("api_framework")


class APIClient:
    def __init__(self, base_url: str = settings.base_url, headers: dict | None = None, auth: httpx.Auth | None = None):
        merged_headers = {"Accept": "application/json"}
        if headers:
            merged_headers.update(headers)
        self.client = httpx.Client(
            base_url=base_url,
            timeout=settings.timeout,
            headers=merged_headers,
            auth=auth,
        )

    @retry(
        stop=stop_after_attempt(settings.max_retries),
        wait=wait_exponential(multiplier=1, min=1, max=5),
        retry=retry_if_exception_type((httpx.TransportError, httpx.TimeoutException)),
        reraise=True,
    )
    def request(self, method: str, endpoint: str, **kwargs) -> httpx.Response:
        with allure.step(f"{method.upper()} {endpoint}"):
            logger.info("Request: %s %s", method.upper(), endpoint)
            response = self.client.request(method, endpoint, **kwargs)

            allure.attach(
                json.dumps(dict(response.request.headers), indent=2),
                name="Request Headers",
                attachment_type=allure.attachment_type.JSON,
            )
            allure.attach(
                response.text,
                name=f"Response Body ({response.status_code})",
                attachment_type=allure.attachment_type.JSON,
            )
            return response

    def get(self, endpoint: str, **kwargs) -> httpx.Response:
        return self.request("GET", endpoint, **kwargs)

    def post(self, endpoint: str, **kwargs) -> httpx.Response:
        return self.request("POST", endpoint, **kwargs)

    def close(self):
        self.client.close()`,

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Execute API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Dependencies
        run: |
          python --version
          python -m pytest --version
          pip show allure-pytest

      - name: Debug Test Collection
        run: |
          ls -la
          ls -la tests/
          python -m pytest tests --collect-only -vv

      - name: Run API Tests
        env:
          TEST_ENV: staging
          CLIENT_ID: \${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: \${{ secrets.CLIENT_SECRET }}
        run: |
          python -m pytest tests -vv -s --alluredir=allure-results

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/

    const sidebarNavEl = document.getElementById("sidebar-nav");

    // Track expanded categories (all expanded by default, collapsible individually or in bulk)
    const expandedCategories = new Set(NAV_CATEGORIES.map((c) => c.id));

    function parseHash() {
      const raw = (window.location.hash || "#/getting-started/project-overview").replace(/^#\/?/, "");
      const parts = raw.split("/").filter(Boolean);
      const catId = parts[0] || "getting-started";
      const pgId = parts[1] || "project-overview";

      const matchedCat = NAV_CATEGORIES.find((c) => c.id === catId) || NAV_CATEGORIES[0];
      const matchedPage = matchedCat.pages.find((p) => p.id === pgId) || matchedCat.pages[0];

      return { categoryId: matchedCat.id, pageId: matchedPage.id };
    }

    function renderSidebar(activeCategoryId, activePageId) {
      sidebarNavEl.innerHTML = NAV_CATEGORIES.map((cat) => {
        const isOpen = expandedCategories.has(cat.id);
        return `
          <div class="rounded-xl border border-slate-200/80 dark:border-slate-800/90 bg-slate-50/70 dark:bg-slate-950/50 overflow-hidden">
            <button type="button" data-cat-toggle="${cat.id}" aria-expanded="${isOpen}"

              <span>${escapeHtml(cat.title)}</span>
              <span class="font-mono text-sm text-cyanBand">${isOpen ? "−" : "+"}</span>
            </button>
            <div class="${isOpen ? "block" : "hidden"} px-2 pb-2 pt-0.5 space-y-1">
              ${cat.pages.map((pg) => {
                const isActive = cat.id === activeCategoryId && pg.id === activePageId;
                return `
                  <a href="#/${cat.id}/${pg.id}" data-nav-link="${cat.id}/${pg.id}"
                     class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 text-xs sm:text-[13px] font-medium transition ${
                       isActive

                     }">

                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");

      sidebarNavEl.querySelectorAll("[data-cat-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const cid = btn.getAttribute("data-cat-toggle");
          if (expandedCategories.has(cid)) {
            expandedCategories.delete(cid);
          } else {
            expandedCategories.add(cid);
          }
          const cur = parseHash();
          renderSidebar(cur.categoryId, cur.pageId);
        });
      });

      sidebarNavEl.querySelectorAll("[data-nav-link]").forEach((link) => {
        link.addEventListener("click", () => {
          closeMobileSidebar();
        });
      });

    function bindDynamicPageInteractions() {
      // Copy buttons
      pageContentEl.querySelectorAll(".copy-btn[data-copy-target]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const codeEl = document.getElementById(btn.getAttribute("data-copy-target"));
          if (!codeEl) return;
          const ta = document.createElement("textarea");
          ta.value = codeEl.textContent || "";
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            showToast("Code copied to clipboard");
          } catch (e) {
            showToast("Unable to copy in this browser");
          }
          document.body.removeChild(ta);
        });
      });

      // Layered Diagram Node clicks
      const diagBtns = pageContentEl.querySelectorAll("[data-diag]");
      if (diagBtns.length > 0) {
        diagBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.getAttribute("data-diag");
            const info = DIAGRAM_NODES[key];
            if (!info) return;
            diagBtns.forEach((b) => b.classList.remove("active-node"));
            btn.classList.add("active-node");
            const t = document.getElementById("diag-title");
            const f = document.getElementById("diag-file");
            const d = document.getElementById("diag-desc");
            const c = document.getElementById("diag-code");
            if (t) t.textContent = info.title;
            if (f) f.textContent = info.file;
            if (d) d.textContent = info.desc;
            if (c) c.textContent = info.code;
          });
        });
      }

      // 8-Step Workflow Step buttons
      const wfBtns = pageContentEl.querySelectorAll("[data-wf-step]");
      if (wfBtns.length > 0) {
        wfBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-wf-step"), 10) || 0;
            const st = EIGHT_STEPS[idx] || EIGHT_STEPS[0];
            wfBtns.forEach((b, i) => {
              b.classList.remove("border-cyanBand", "ring-2", "ring-cyanBand/30", "bg-sky-50/60", "dark:bg-sky-950/30");
              b.classList.add("border-slate-200", "dark:border-slate-800", "bg-slate-50", "dark:bg-slate-950");
              if (i === idx) {
                b.classList.remove("border-slate-200", "dark:border-slate-800", "bg-slate-50", "dark:bg-slate-950");
                b.classList.add("border-cyanBand", "ring-2", "ring-cyanBand/30", "bg-sky-50/60", "dark:bg-sky-950/30");
              }
            });
            const dt = document.getElementById("wf-detail-title");
            const dtag = document.getElementById("wf-detail-tag");
            const dc = document.getElementById("wf-detail-code");
            if (dt) dt.textContent = `Step ${st.num}: ${st.name}`;
            if (dtag) dtag.textContent = st.tag;
            if (dc) dc.textContent = st.code;
          });
        });
      }

      // CI Summary Presets & Live Inputs
      const ciPresets = {
        run30: { run: "Run #30 (Manual dispatch)", total: 2, passed: 2, failed: 0, skipped: 0, duration: "1.84s", env: "staging" },
        run29: { run: "Run #29 (Workflow update)", total: 2, passed: 2, failed: 0, skipped: 0, duration: "1.92s", env: "staging" },
        run28: { run: "Run #28 (Settings refactoring)", total: 2, passed: 2, failed: 0, skipped: 0, duration: "1.76s", env: "dev" },
        run27: { run: "Run #27 (API client setup)", total: 2, passed: 2, failed: 0, skipped: 0, duration: "2.05s", env: "staging" },
        run26: { run: "Run #26 (Dependency updates)", total: 2, passed: 2, failed: 0, skipped: 0, duration: "2.18s", env: "staging" },
      };

      function refreshCiMetrics(customLabel) {
        const inTotal = document.getElementById("ci-in-total");
        const inPassed = document.getElementById("ci-in-passed");
        const inFailed = document.getElementById("ci-in-failed");
        const inSkipped = document.getElementById("ci-in-skipped");
        const inDuration = document.getElementById("ci-in-duration");
        const inEnv = document.getElementById("ci-in-env");
        if (!inTotal) return;

        const t = Math.max(0, parseInt(inTotal.value, 10) || 0);
        const p = Math.max(0, parseInt(inPassed.value, 10) || 0);
        const f = Math.max(0, parseInt(inFailed.value, 10) || 0);
        const s = Math.max(0, parseInt(inSkipped.value, 10) || 0);
        const d = (inDuration.value || "0.00s").trim();
        const e = (inEnv.value || "staging").trim();
        const denom = p + f;
        const pct = denom > 0 ? ((p / denom) * 100).toFixed(1) : "0.0";

        document.getElementById("m-total").textContent = String(t);
        document.getElementById("m-passed").textContent = String(p);
        document.getElementById("m-failed").textContent = String(f);
        document.getElementById("m-skipped").textContent = String(s);
        document.getElementById("m-duration").textContent = d;
        document.getElementById("m-env").textContent = e;
        document.getElementById("m-rate").textContent = `${pct}% pass rate`;
        if (customLabel) {
          document.getElementById("m-run").textContent = customLabel;
        }
      }

      pageContentEl.querySelectorAll("[data-ci-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const pk = btn.getAttribute("data-ci-preset");
          const pr = ciPresets[pk];
          if (!pr) return;
          document.getElementById("ci-in-total").value = pr.total;
          document.getElementById("ci-in-passed").value = pr.passed;
          document.getElementById("ci-in-failed").value = pr.failed;
          document.getElementById("ci-in-skipped").value = pr.skipped;
          document.getElementById("ci-in-duration").value = pr.duration;
          document.getElementById("ci-in-env").value = pr.env;

          pageContentEl.querySelectorAll("[data-ci-preset]").forEach((b) => {
            b.classList.remove("bg-navyBar", "text-white");
            b.classList.add("bg-slate-100", "dark:bg-slate-800", "text-slate-700", "dark:text-slate-300");
          });
          btn.classList.remove("bg-slate-100", "dark:bg-slate-800", "text-slate-700", "dark:text-slate-300");
          btn.classList.add("bg-navyBar", "text-white");
          refreshCiMetrics(pr.run);
        });
      });

      pageContentEl.querySelectorAll(".ci-edit").forEach((inp) => {
        inp.addEventListener("input", () => refreshCiMetrics("Custom CI Summary"));
        inp.addEventListener("change", () => refreshCiMetrics("Custom CI Summary"));
      });
    }

    // Theme Toggle persisted in localStorage
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    const themeIconEl = document.getElementById("theme-icon");
    const themeLabelEl = document.getElementById("theme-label");

    function applyTheme(mode) {
      const root = document.documentElement;
      if (mode === "light") {
        root.classList.remove("dark");
        themeIconEl.textContent = "🌙";
        themeLabelEl.textContent = "Dark";
      } else {
        root.classList.add("dark");
        themeIconEl.textContent = "☀";
        themeLabelEl.textContent = "Light";
      }
      try {
        localStorage.setItem("api_docs_theme", mode);
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem("api_docs_theme") || "dark";
    } catch (e) {
      savedTheme = "dark";
    }
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");

        viewportFrame.classList.remove("max-w-7xl", "max-w-[768px]", "max-w-[390px]", "border-x", "border-cyanBand/40", "shadow-xl");

      toast.classList.add("flex");

        toast.classList.remove("flex");
